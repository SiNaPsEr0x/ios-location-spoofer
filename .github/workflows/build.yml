name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Tunnel/**'
      - 'Resources/**'
      - 'GoSpoofer/**/*.go'
      - 'GoSpoofer/**/*.h'
      - 'GoSpoofer/*.modulemap'
      - 'GoSpoofer/go.mod'
      - 'GoSpoofer/go.sum'
      - 'GoSpoofer/make.sh'
      - 'project.yml'
      - 'scripts/ci/**'
      - '!**/*.md'
      - '!**/.DS_Store'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  GOTOOLCHAIN: local
  RELEASE_TAG: latest

jobs:
  build:
    name: Test, build and replace the single Release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set calendar version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Rome"))
          iso = now.isocalendar()
          print(f"{iso.year}.{iso.week:02d}.{iso.weekday}")
          PY
          )"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"

      - name: Set up Go from go.mod
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: GoSpoofer/go.mod
          cache-dependency-path: GoSpoofer/go.sum
          cache: true

      - name: Prepare and fingerprint Apple toolchain
        id: toolchain
        run: |
          set -euo pipefail
          brew list --versions xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodegen --version
          fingerprint=$({ xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; xcodegen --version; } | shasum -a 256 | awk '{print $1}')
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Run Go tests and race detector
        working-directory: GoSpoofer
        run: |
          set -euo pipefail
          go mod verify
          go test -mod=readonly -race -count=1 ./...
          go vet -mod=readonly ./...

      - name: Cache Go iOS static library and matching header
        id: go-library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: GoSpoofer/build
          key: go-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('GoSpoofer/**/*.go', 'GoSpoofer/go.mod', 'GoSpoofer/go.sum', 'GoSpoofer/make.sh') }}

      - name: Compile Go for iOS arm64
        if: steps.go-library.outputs.cache-hit != 'true'
        run: bash GoSpoofer/make.sh

      - name: Restore matching C header and generate Xcode project
        run: |
          set -euo pipefail
          test -s GoSpoofer/build/libgolocationspoofer.a
          test -s GoSpoofer/build/libgolocationspoofer.h
          cp GoSpoofer/build/libgolocationspoofer.h GoSpoofer/golocationspoofer.h
          xcrun lipo GoSpoofer/build/libgolocationspoofer.a -verify_arch arm64
          xcodegen generate --spec project.yml

      - name: Cache incremental Xcode build data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build/DerivedData
          key: xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('App/**', 'Tunnel/**', 'Resources/**', 'GoSpoofer/**/*.go', 'GoSpoofer/**/*.h', 'GoSpoofer/go.mod', 'GoSpoofer/go.sum', 'GoSpoofer/make.sh', 'project.yml', 'scripts/ci/**') }}
          restore-keys: |
            xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ steps.go.outputs.go-version }}-

      - name: Build, package and verify unsigned IPA
        id: ipa
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/ci/build-unsigned.sh

      - name: Replace the single GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          set -euo pipefail
          asset_name="$(basename "$IPA_PATH")"

          # There must be only one GitHub Release. Remove every historical release
          # and its release tag, while preserving unrelated non-release tags.
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$RELEASE_TAG" ]] && continue
            echo "Deleting historical release: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')

          # Keep one stable tag and move it to the commit that produced this IPA.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"               -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi

          notes="$(cat <<EOF
          Current unsigned build of Location Spoofer.

          Version: $APP_VERSION
          Commit: $GITHUB_SHA
          Architecture: arm64
          Contents: iOS app + Packet Tunnel extension

          This IPA is unsigned and must be signed with compatible Network Extension and App Group entitlements before installation.
          EOF
          )"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG"               --title "Location Spoofer $APP_VERSION"               --notes "$notes"               --latest
          else
            gh release create "$RELEASE_TAG"               --verify-tag               --title "Location Spoofer $APP_VERSION"               --notes "$notes"               --latest
          fi

          # Keep exactly one asset in the one Release.
          while IFS= read -r old_asset; do
            [[ -z "$old_asset" || "$old_asset" == "$asset_name" ]] && continue
            gh release delete-asset "$RELEASE_TAG" "$old_asset" --yes
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

          gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber

          release_count="$(gh release list --limit 1000 --json tagName --jq 'length')"
          asset_count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          [[ "$release_count" -eq 1 ]]
          [[ "$asset_count" -eq 1 ]]

          release_url="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          echo "url=$release_url" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Delete historical Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Release is the canonical download. Do not keep IPA copies as
          # GitHub Actions artifacts from this or older workflow runs.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"             --jq '.artifacts[].id' |
          while IFS= read -r artifact_id; do
            [[ -z "$artifact_id" ]] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done

      - name: Report Release and cache status
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          APP_VERSION: ${{ steps.release.outputs.version }}
          LIBRARY_CACHE_HIT: ${{ steps.go-library.outputs.cache-hit }}
        run: |
          printf '\n## Location Spoofer %s\n\n[Download the only current Release](%s)\n\nStable tag: `latest`\n\nGo library cache hit: `%s`\n'             "$APP_VERSION" "$RELEASE_URL" "$LIBRARY_CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
