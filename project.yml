name: location-spoofer
options:
  bundleIdPrefix: dev.duti.location-spoofer
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  location-spoofer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["**/.DS_Store"]
      - path: Resources
        excludes: ["**/.DS_Store", "Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.duti.location-spoofer
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/location-spoofer.entitlements
        CODE_SIGN_STYLE: Automatic
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "$(inherited)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: location-spoofer-tunnel
        embed: true
        codeSign: true

  location-spoofer-tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes: ["**/.DS_Store", "Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.duti.location-spoofer.tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/location-spoofer-tunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        SKIP_INSTALL: "YES"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/GoSpoofer"
        SWIFT_OBJC_BRIDGING_HEADER: "Tunnel/location-spoofer-tunnel-Bridging-Header.h"
    dependencies:
      # Link the static archive, never copy it or the Go executable as a resource.
      - framework: GoSpoofer/build/libgolocationspoofer.a
        embed: false
        codeSign: false
      - sdk: NetworkExtension.framework

schemes:
  location-spoofer:
    build:
      targets:
        location-spoofer: all
        location-spoofer-tunnel: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  location-spoofer-debug:
    build:
      targets:
        location-spoofer: all
        location-spoofer-tunnel: all
    run:
      config: Debug
      commandLineArguments:
        "-FIRDebugEnabled": true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  location-spoofer-tunnel:
    build:
      targets:
        location-spoofer-tunnel: all
    run:
      config: Debug
      commandLineArguments:
        "-NEDebugTunnel": true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
